name: Publish technical report

on:
  push:
    branches: [main, master]
    paths:
      - "doc/**"
      - "src/**"
      - "website/**"
      - ".github/workflows/technical-report-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build web edition
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python website/build.py --source doc --output website/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
